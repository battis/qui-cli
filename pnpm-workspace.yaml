publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@commitlint/*'
  - commit-and-tag-version
  - lerna
  - monorepo-package-paths
  - npm-run-all
allowBuilds:
  esbuild: true
  nx: true
packages:
  - packages/*
  - examples/*
  - '!examples/02 Reusable Plugin'
  - 'examples/02 Reusable Plugin/*'
  - '!examples/dev-plugin'
  - examples/dev-plugin/*
  - '!examples/dev-sequenced-commands'
  - examples/dev-sequenced-commands/*
  - '!examples/dev-peer-of-peer'
  - examples/dev-peer-of-peer/*
minimumReleaseAgeExclude:
  - '@battis/*'
  - '@qui-cli/*'
catalogs:
  prod:
    '@inquirer/confirm': ^6.1.1
    '@inquirer/input': ^5.1.2
    '@tsconfig/node-lts': ^24.0.0
    '@types/node': ^24.13.3
    commit-and-tag-version: ~13.1.2
    del-cli: ^7.0.0
    npm-run-all: ^4.1.5
    typescript: ^5.9.3
    app-root-path: ^3.1.0
  peers:
    '@qui-cli/colors': '>=3.2'
    '@qui-cli/core': '>=4'
    '@qui-cli/log': '>=3'
    '@qui-cli/plugin': '>=3'
    '@qui-cli/root': '>=3'
    '@qui-cli/shell': '>=3'
